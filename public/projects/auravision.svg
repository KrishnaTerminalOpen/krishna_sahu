<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="480" fill="#0d0e12"/>
  <defs>
    <radialGradient id="auraglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e4a853" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0d0e12" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="480" fill="url(#grid)" />
  <circle cx="400" cy="240" r="280" fill="url(#auraglow)"/>
  
  <!-- Bounding Boxes for Defect Detection Visual -->
  <rect x="220" y="110" width="220" height="180" rx="4" fill="rgba(228,168,83,0.06)" stroke="#e4a853" stroke-width="1.5" stroke-dasharray="4 2"/>
  <rect x="220" y="90" width="130" height="20" rx="2" fill="#e4a853"/>
  <text x="226" y="104" font-family="monospace" font-size="10" fill="#0d0e12" font-weight="bold">DEFECT_01 · 98.4%</text>

  <rect x="470" y="180" width="160" height="140" rx="4" fill="rgba(56,189,248,0.05)" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="470" y="162" width="120" height="18" rx="2" fill="#38bdf8"/>
  <text x="476" y="175" font-family="monospace" font-size="9" fill="#0d0e12" font-weight="bold">SURFACE_OK · 99.1%</text>

  <!-- Crosshair Reticle -->
  <circle cx="330" cy="200" r="14" stroke="#e4a853" stroke-width="1" opacity="0.6"/>
  <line x1="330" y1="180" x2="330" y2="220" stroke="#e4a853" stroke-width="1" opacity="0.4"/>
  <line x1="310" y1="200" x2="350" y2="200" stroke="#e4a853" stroke-width="1" opacity="0.4"/>

  <!-- Telemetry Overlay Bar -->
  <rect x="60" y="380" width="680" height="48" rx="8" fill="#13151a" stroke="rgba(255,255,255,0.08)"/>
  <text x="80" y="409" font-family="monospace" font-size="11" fill="#e4a853">● LIVE INFERENCE</text>
  <text x="220" y="409" font-family="monospace" font-size="11" fill="#a1a1aa">LATENCY: 32ms</text>
  <text x="360" y="409" font-family="monospace" font-size="11" fill="#a1a1aa">BACKBONE: YOLOv8 FP16</text>
  <text x="560" y="409" font-family="monospace" font-size="11" fill="#38bdf8">PRECISION: 98.4%</text>
</svg>
